<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EBMS{% endblock %} · Electricity Bill Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.admin %}
  <nav class="nav no-print">
    <span class="brand">⚡ EBMS</span>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('consumers') }}">Consumers</a>
    <a href="{{ url_for('bills') }}">Bills</a>
    <a href="{{ url_for('payments') }}">Payments</a>
    <a href="{{ url_for('tariff') }}">Tariff</a>
    <span class="spacer"></span>
    <span class="muted">{{ session.admin }}</span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% endif %}
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }} no-print">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
